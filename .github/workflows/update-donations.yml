name: Reusable - Update Donation Block

on:
  workflow_call:

jobs:
  update-donations:
    runs-on: ubuntu-latest
    # Documents the requirement; the caller must grant contents: write as well
    permissions:
      contents: write
    # One run per calling repo at a time; queued pushes then rebase cleanly
    concurrency:
      group: update-donations-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7

      # Clone (instead of fetching raw.githubusercontent.com) so the script and
      # donations.md are always the same, uncached revision. Cloned outside the
      # workspace so its README.md is never picked up.
      - name: Fetch updater from central repo
        run: |
          set -euo pipefail
          git clone --depth 1 --quiet \
            https://github.com/magicdude4eva/common-repo-workflow.git \
            "$RUNNER_TEMP/common-repo-workflow"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run updater
        run: node "$RUNNER_TEMP/common-repo-workflow/update-donations.js"

      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files -m -z -- '*README.md' | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "No donation block changes."
            exit 0
          fi
          git commit -m "chore: update donation block"
          # Another push may have landed while this ran; rebase and retry
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          exit 1
